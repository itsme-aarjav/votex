# SonarQube Configuration for Votex Distributed Platform

sonar.projectKey=votex-platform
sonar.projectName=Votex - Distributed Real-Time Polling Platform
sonar.projectVersion=2.0.0

# Source directories for analysis
sonar.sources=vote,result,worker

# Test directories
sonar.tests=tests,result/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.min.js,**/vendor/**,**/.vscode/**

# Source encodings
sonar.sourceEncoding=UTF-8

# Language specific settings
sonar.python.version=3.11
sonar.javascript.node.maxspace=4096
sonar.qualitygate.wait=true
