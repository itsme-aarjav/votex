apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-cluster-viewer
rules:
- apiGroups: [""]
  resources: ["namespaces", "nodes", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-cluster-viewer-binding
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-cluster-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: votex
rules:
- apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io", "policy"]
  resources: ["deployments", "statefulsets", "services", "serviceaccounts", "pods", "pods/exec", "pods/log", "persistentvolumeclaims", "configmaps", "secrets", "ingresses", "horizontalpodautoscalers", "poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: votex
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agent-role
  namespace: jenkins
rules:
- apiGroups: ["", "batch"]
  resources: ["pods", "pods/exec", "pods/log"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-binding
  namespace: jenkins
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc
  namespace: jenkins
data:
  jenkins.yaml: |
    jenkins:
      systemMessage: "Votex Platform Automated CI/CD Controller"
      numExecutors: 0
      mode: EXCLUSIVE
      scmCheckoutRetryCount: 3
      clouds:
        - kubernetes:
            name: "kubernetes"
            serverUrl: "https://kubernetes.default.svc.cluster.local"
            namespace: "jenkins"
            jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
            jenkinsTunnel: "jenkins.jenkins.svc.cluster.local:50000"
            containerCapStr: "10"
            retentionTimeout: 10
            connectTimeout: 100
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "admin"
              name: "Administrator"
              password: "${JENKINS_ADMIN_PASSWORD}"
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false
    credentials:
      system:
        domainCredentials:
          - credentials:
              - usernamePassword:
                  scope: GLOBAL
                  id: "dockerhub-credentials"
                  username: "${VOTEX_DOCKERHUB_USERNAME}"
                  password: "${VOTEX_DOCKERHUB_TOKEN}"
              - string:
                  scope: GLOBAL
                  id: "sonarqube-token"
                  secret: "${VOTEX_SONARQUBE_TOKEN}"
              - file:
                  scope: GLOBAL
                  id: "k8s-kubeconfig"
                  fileName: "kubeconfig"
                  secretBytes: "${readFileBase64:/var/jenkins_home/credentials/kubeconfig}"
    jobs:
      - script: >
          pipelineJob('votex-pipeline') {
            description('Votex 9-stage DevSecOps Delivery Pipeline')
            triggers {
              scm('H/5 * * * *')
            }
            definition {
              cpsScm {
                scm {
                  git {
                    remote {
                      url('https://github.com/itsme-aarjav/votex.git')
                    }
                    branch('*/main')
                  }
                }
                scriptPath('jenkins/Jenkinsfile')
                lightweight(true)
              }
            }
          }
    unclassified:
      sonarGlobalConfiguration:
        buildWrapperEnabled: false
        installations:
          - name: "SonarQube"
            serverUrl: "http://sonarqube.sonarqube.svc.cluster.local:9000"
            credentialsId: "sonarqube-token"
            additionalAnalysisProperties: "sonar.language=python,js"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
      - name: install-plugins
        image: jenkins/jenkins:lts-jdk17
        command:
        - /bin/sh
        - -c
        - |
          jenkins-plugin-cli --plugins \
            configuration-as-code \
            kubernetes \
            sonar \
            git \
            workflow-aggregator \
            credentials-binding \
            pipeline-stage-view \
            ws-cleanup \
            job-dsl \
            --plugin-download-directory /var/jenkins_home/plugins
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
      containers:
      - name: jenkins
        image: jenkins/jenkins:lts-jdk17
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50000
          name: agent
        env:
        - name: CASC_JENKINS_CONFIG
          value: /var/jenkins_home/casc_configs/jenkins.yaml
        - name: JAVA_OPTS
          value: "-Djenkins.install.runSetupWizard=false"
        - name: JENKINS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jenkins-admin-credentials
              key: jenkins-admin-password
        - name: CASC_STRICT_SECRET_RESOLUTION
          value: "true"
        envFrom:
        - secretRef:
            name: jenkins-pipeline-credentials
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1.5Gi
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        - name: casc-config
          mountPath: /var/jenkins_home/casc_configs
        - name: agent-kubeconfig
          mountPath: /var/jenkins_home/credentials
          readOnly: true
      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-pvc
      - name: casc-config
        configMap:
          name: jenkins-casc
      - name: agent-kubeconfig
        configMap:
          name: jenkins-agent-kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 50000
    targetPort: 50000
    name: agent
  selector:
    app: jenkins
