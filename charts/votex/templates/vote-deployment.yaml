apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    {{- include "votex.labels" . | nindent 4 }}
    app: vote
spec:
  {{- if not .Values.vote.autoscaling.enabled }}
  replicas: {{ .Values.vote.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: "{{ .Values.vote.image.repository }}:{{ .Values.vote.image.tag }}"
        imagePullPolicy: {{ .Values.vote.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.vote.service.targetPort }}
          name: vote
        env:
        - name: OPTION_A
          value: {{ .Values.vote.env.optionA | quote }}
        - name: OPTION_B
          value: {{ .Values.vote.env.optionB | quote }}
        resources:
          {{- toYaml .Values.vote.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.vote.probes.liveness.path }}
            port: {{ .Values.vote.service.targetPort }}
          initialDelaySeconds: {{ .Values.vote.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.vote.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.vote.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.vote.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.vote.probes.readiness.path }}
            port: {{ .Values.vote.service.targetPort }}
          initialDelaySeconds: {{ .Values.vote.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.vote.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.vote.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.vote.probes.readiness.failureThreshold }}
