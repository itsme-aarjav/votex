# Grafana Alloy Helm Values
# Modern log forwarder replacing deprecated Promtail
# Scrapes Kubernetes container logs (Vote, Result, Worker, Redis, DB) and pushes to Loki.

controller:
  type: daemonset

alloy:
  mounts:
    varlog: true

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

  configMap:
    content: |
      // Discover Kubernetes pods across the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Filter to local node pods and assign metadata labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          action        = "keep"
          regex         = coalesce(env("NODE_NAME"), env("HOSTNAME"))
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      // Discover container log files on local node matching target paths
      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      // Process and parse CRI container log lines
      loki.process "container_logs" {
        stage.cri {}

        forward_to = [loki.write.loki_endpoint.receiver]
      }

      // Tail discovered log files and forward to processing pipeline
      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.container_logs.receiver]
      }

      // Forward structured log streams to Loki
      loki.write "loki_endpoint" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
