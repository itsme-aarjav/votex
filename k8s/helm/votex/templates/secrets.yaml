apiVersion: v1
kind: Secret
metadata:
  name: {{ include "votex.fullname" . }}-db-secret
  labels:
    {{- include "votex.labels" . | nindent 4 }}
    app: db
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.db.credentials.database | quote }}
