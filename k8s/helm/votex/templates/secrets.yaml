{{- if not .Values.db.existingSecret }}
{{- if empty .Values.db.credentials.password }}
{{- fail "DEPLOYMENT FAILED: Database password is required. Either specify a pre-created secret via '--set db.existingSecret=<secret-name>' or provide a password via '--set db.credentials.password=<password>'." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "votex.fullname" . }}-db-secret
  labels:
    {{- include "votex.labels" . | nindent 4 }}
    app: db
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.credentials.username | default "postgres" | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.db.credentials.database | default "postgres" | quote }}
{{- end }}
