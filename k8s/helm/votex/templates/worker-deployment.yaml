apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "votex.labels" . | nindent 4 }}
    app: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: worker
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
        imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: {{ .Values.redis.service.port | quote }}
        - name: POSTGRES_HOST
          value: "db"
        {{- if .Values.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
        - name: OTEL_SERVICE_NAME
          value: "votex-worker"
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ include "votex.dbSecretName" . }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
