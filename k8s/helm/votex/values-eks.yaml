# AWS EKS Helm values for Votex
global:
  environment: production
  imagePullPolicy: IfNotPresent

# Vote service (Python / Flask)
vote:
  replicaCount: 2
  image:
    repository: aarjavjainn/votex-vote
    tag: v2.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  probes:
    liveness:
      path: /api/health
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    optionA: "Cats"
    optionB: "Dogs"

# Result service (Node.js)
result:
  replicaCount: 2
  image:
    repository: aarjavjainn/votex-result
    tag: v2.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  probes:
    liveness:
      path: /api/health
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

# Worker daemon (Python)
worker:
  replicaCount: 1
  image:
    repository: aarjavjainn/votex-worker
    tag: v2.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Redis queue
redis:
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: "gp3"
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5

# PostgreSQL database
db:
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: "gp3"
  existingSecret: "db-secret"
  credentials:
    username: postgres
    password: ""
    database: postgres
  probes:
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5

ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-north-1:123456789012:certificate/example"
  hosts:
    - host: vote.votex.domain.tld
      paths:
        - path: /
          pathType: Prefix
          service: vote
    - host: result.votex.domain.tld
      paths:
        - path: /
          pathType: Prefix
          service: result
  tls: []

# OpenTelemetry Distributed Tracing & Collector
otel:
  enabled: true
  endpoint: "http://otel-collector:4317"
  collector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.95.0"
    awsRegion: eu-north-1
    requireRoleArn: true
    serviceAccount:
      roleArn: ""
