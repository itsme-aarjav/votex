services:
  vote:
    image: ${VOTE_IMAGE:-votex-vote:candidate}
    build: 
      context: ../votex/vote
      target: dev
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      RESULT_URL: "http://localhost:5001"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck: 
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
     - ../votex/vote:/usr/local/app
    ports:
      - "5002:80"
    networks:
      - front-tier
      - back-tier

  result:
    build: ../votex/result
    entrypoint: nodemon --inspect=0.0.0.0 server.js
    environment:
      PORT: "80"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
      VOTE_URL: "http://localhost:5002"
    depends_on:
      db:
        condition: service_healthy 
    volumes:
      - ../votex/result:/usr/local/app
    ports:
      - "5001:80"
      - "127.0.0.1:9229:9229"
    networks:
      - front-tier
      - back-tier

  worker:
    build:
      context: ../votex/worker
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    networks:
      - back-tier

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"
      - "../votex/healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "../votex/healthchecks:/healthchecks"
      - "../votex/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

  seed:
    build: ../votex/seed-data
    profiles: ["seed"]
    depends_on:
      vote:
        condition: service_healthy 
    networks:
      - front-tier
    restart: "no"

volumes:
  db-data:
  redis-data:

networks:
  front-tier:
  back-tier:
