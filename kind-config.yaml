# Kind Cluster Configuration optimized for AWS EC2 & Local Ingress
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: votex
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Ingress HTTP & HTTPS port mappings
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # Direct NodePort mappings for Vote & Result
  - containerPort: 31002
    hostPort: 31002
    protocol: TCP
  - containerPort: 31001
    hostPort: 31001
    protocol: TCP
